<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SevaDesk console{% endblock %}</title>
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --bg:#f8fafc; --card:#fff; --accent:#0f766e; --warn:#b45309; --danger:#b91c1c; --ok:#15803d; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#0f172a; color:#fff; padding:10px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  header a { color:#e2e8f0; text-decoration:none; } header a:hover { text-decoration:underline; }
  header .brand { font-weight:700; letter-spacing:.3px; }
  header .spacer { flex:1; }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:#334155; color:#fff; }
  .badge.auto { background:var(--ok); } .badge.draft { background:var(--warn); } .badge.off { background:#475569; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 12px; } h2 { font-size:16px; margin:20px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .notice { background:#ecfdf5; border-color:#a7f3d0; }
  .muted { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  form.inline { display:inline; }
  button, .btn { font:inherit; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--danger); border-color:#fecaca; }
  textarea, input[type=text], input[type=password] { font:inherit; width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .draft { border-left:4px solid var(--warn); }
  .draft.clinical { border-left-color:var(--danger); }
  .quote { background:#f1f5f9; border-radius:6px; padding:8px 10px; white-space:pre-wrap; }
  .chat { display:flex; flex-direction:column; gap:6px; }
  .bubble { max-width:75%; padding:8px 10px; border-radius:10px; white-space:pre-wrap; }
  .bubble.in { background:#fff; border:1px solid var(--line); align-self:flex-start; }
  .bubble.out { background:#d1fae5; align-self:flex-end; }
  .bubble.echo { background:#dbeafe; align-self:flex-end; }
  .bubble .meta { display:block; font-size:11px; color:var(--muted); margin-top:4px; }
  .tag { font-size:11px; padding:0 6px; border-radius:4px; background:#e2e8f0; }
  .tag.EMERGENCY { background:#fee2e2; color:var(--danger); } .tag.CLINICAL { background:#fef3c7; color:var(--warn); }
</style>
</head>
<body>
<header>
  <span class="brand">SevaDesk · Dr. {{ settings.doctor_name }} · {{ settings.clinic_name }}</span>
  <a href="/console">Drafts</a>
  <a href="/console/usage">Usage &amp; cost</a>
  <span class="spacer"></span>
  {% if mode %}<span>Mode <span class="badge {{ mode }}">{{ mode|upper }}</span></span>{% endif %}
  {% if settings.dry_run %}<span class="badge">DRY RUN</span>{% endif %}
  {% if mode %}<form class="inline" method="post" action="/console/logout"><button type="submit">Log out</button></form>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
