{% extends "base.html" %}
{% block title %}Sign in · SevaDesk console{% endblock %}
{% block content %}
<h1>Doctor console</h1>
<div class="card" style="max-width:420px">
  {% if error %}<p style="color:var(--danger)">That token is not correct.</p>{% endif %}
  <form method="post" action="/console/login">
    <label for="token">Console token <span class="muted">(CONSOLE_TOKEN in .env)</span></label>
    <input id="token" type="password" name="token" autocomplete="current-password" autofocus required>
    <p><button class="primary" type="submit">Sign in</button></p>
  </form>
  <p class="muted">This console shows patient messages. Do not share the token or leave the page open on a shared device.</p>
</div>
{% endblock %}
